name: Frontend Code Quality

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

jobs:
  biome-check:
    name: Biome Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
          
      - name: Run Biome check
        run: cd frontend && npm run check:biome-ci
        
      - name: Run TypeScript check
        run: cd frontend && npm run typecheck
        
      - name: Run tests
        run: cd frontend && npm run test 