name: Frontend Quality

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

jobs:
  frontend-tests:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        env:
          HUSKY: 0
        run: |
          # Install frontend dependencies using the same pattern as full-test-suite.yml
          echo "Installing frontend dependencies..."
          # Clear npm cache and remove node_modules
          npm cache clean --force
          rm -rf node_modules package-lock.json
          # Install with explicit platform-specific binaries
          npm install
          # Ensure the correct platform-specific native modules are available
          npm install @rollup/rollup-linux-x64-gnu --save-dev
          npm install @biomejs/cli-linux-x64 --save-dev
          echo "✅ Frontend dependencies installed successfully"
          
      - name: Verify installations
        working-directory: ./frontend
        run: |
          echo "Verifying installations..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "✅ Installation verification completed"
          
      - name: Run Biome check
        working-directory: ./frontend
        run: |
          echo "Running Biome check..."
          npm run check:biome-ci
          echo "✅ Biome check passed"
        
      - name: Run TypeScript check
        working-directory: ./frontend
        run: |
          echo "Running TypeScript check..."
          npm run typecheck
          echo "✅ TypeScript check passed"
        
      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          echo "Running frontend tests..."
          npm run test
          echo "✅ Frontend tests completed"
        
      - name: Build frontend
        working-directory: ./frontend
        run: |
          echo "Building frontend..."
          npm run build
          echo "✅ Frontend build completed"
